[project]
name = "gcml"
version = "0.1.0"
description = "Goal-directed cognitive map learning research experiments"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "h5py>=3.11",
  "hydra-core>=1.3.2",
  "matplotlib>=3.8",
  "networkx>=3.3",
  "numpy>=1.26,<3",
  "scikit-learn>=1.4",
  "seaborn>=0.13",
  "torch>=2.3",
  "tqdm>=4.66",
]

[dependency-groups]
dev = [
  "pytest>=8.2",
  "ruff>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.uv]
package = false
